
databaseChangeLog:
  - changeSet:
      id: 002-create-gyms-table
      author: pranav
      changes:
        - createTable:
            tableName: gyms
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_gyms
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: city
                  type: VARCHAR(100)

              - column:
                  name: state
                  type: VARCHAR(100)

              - column:
                  name: postal_code
                  type: VARCHAR(20)

              - column:
                  name: phone
                  type: VARCHAR(20)

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
